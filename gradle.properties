# Gradle 守护进程内存配置；JDK 路径由使用者环境提供，不要写死机器路径。
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m

# ---- 快速编译相关（详见 BUILDING.zh-CN.md）---------------------------------
# 并行：本工程有 main / apiMod / regressionTest 三个 source set，可并行调度。
org.gradle.parallel=true

# 构建缓存：任务输出按内容复用，重复构建和换分支时直接命中。
org.gradle.caching=true

# 配置缓存：跳过重复的配置阶段。Windows 暖守护进程实测
# assemble 2.8s -> 1.9s（约 -33%）。若某个环境上出现意外，
# 用 --no-configuration-cache 单次关闭，或把这一行删掉即可。
org.gradle.configuration-cache=true

# 守护进程必须保留：实测 --no-daemon 让 assemble 从 2.8s 变成 12.4s。
org.gradle.daemon=true
