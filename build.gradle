// Acbric 构建入口：启动层、API、回归检查与本地分发。
// 游戏字节码、资源和 native 库需自行放入 libs/ 与 game/，详见 README.zh-CN.md。
// Gradle 工程版本用于产物文件名；API 版本另由 src/apiMod/resources/fabric.mod.json 声明。

plugins {
    id 'java'
}

group = 'net.fabricacs'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ---- 输入自检：把"游戏文件没准备好"变成一句人话 ----------------------------
// 缺 libs/asplit-*.zip 时，compileApiModJava 会以 800+ 行 Gradle 原始输出失败，
// 新协作者和新机器上完全看不出该怎么办。这里提前检查并给出可直接照做的指引。
//
// 只检查"编译必需"的文件；game/ 只有真正启动游戏时才需要，另由 verifyGameInputs 负责。
// 文件对象在配置阶段就解析好，doLast 里不碰 project，保证配置缓存可用。
def compileInputs = [
        ['libs/asplit-A.zip',             '游戏内核 class，编译与运行都依赖'],
        ['libs/asplit-B.zip',             '游戏内核 class，编译与运行都依赖'],
        ['libs/fabric-loader-0.19.3.jar', 'Fabric Loader，compileOnly 依赖'],
].collect { [it[0], layout.projectDirectory.file(it[0]).asFile, it[1]] }

tasks.register('verifyFrameworkInputs') {
    group = 'acbric'
    description = 'Fails early with an actionable message when game files required for compilation are missing.'
    doLast {
        def missing = compileInputs.findAll { !it[1].isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    'Missing game files required for compilation:\n' +
                    missing.collect { '  - ' + it[0] + '   (' + it[2] + ')' }.join('\n') +
                    '\n\nThese files are NOT redistributed with this repository (copyright).' +
                    '\nCopy them from your own Airships: Conquer the Skies installation into this project\'s libs/.' +
                    '\nSee BUILDING.md / BUILDING.zh-CN.md for the exact list and one-line copy command.')
        }
    }
}

// 回归测试另外需要 libs/FloatIO.jar（--patch-module jdk.unsupported 的补丁源）。
// 它只在跑测试时用，所以单独检查：缺它仍可用 build 快速编译，只有 test / check 会要求补齐。
def testInputs = [
        ['libs/FloatIO.jar', '原版 JSON 小数格式化依赖，regressionTest 的 --patch-module 需要'],
].collect { [it[0], layout.projectDirectory.file(it[0]).asFile, it[1]] }

tasks.register('verifyTestInputs') {
    group = 'acbric'
    description = 'Fails early with an actionable message when files required by regressionTest are missing.'
    doLast {
        def missing = testInputs.findAll { !it[1].isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    'Missing game files required for regression tests:\n' +
                    missing.collect { '  - ' + it[0] + '   (' + it[2] + ')' }.join('\n') +
                    '\n\nThese files are NOT redistributed with this repository (copyright).' +
                    '\nCopy them from your own Airships: Conquer the Skies installation into this project\'s libs/.' +
                    '\nSee BUILDING.md / BUILDING.zh-CN.md for the exact list and one-line copy command.')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('verifyFrameworkInputs')
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.fabricmc.net/'
    }
}

configurations {
    fabricLoaderRuntime
}

dependencies {
    compileOnly files('libs/fabric-loader-0.19.3.jar')
    // 启动层只读字节码常量，不提前加载/初始化游戏类；运行时沿用已有 ASM。
    compileOnly 'org.ow2.asm:asm:9.8'
    fabricLoaderRuntime files('libs/fabric-loader-0.19.3.jar')
    fabricLoaderRuntime 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
    fabricLoaderRuntime 'org.ow2.asm:asm:9.8'
    fabricLoaderRuntime 'org.ow2.asm:asm-analysis:9.8'
    fabricLoaderRuntime 'org.ow2.asm:asm-commons:9.8'
    fabricLoaderRuntime 'org.ow2.asm:asm-tree:9.8'
    fabricLoaderRuntime 'org.ow2.asm:asm-util:9.8'
}

sourceSets {
    main { java.srcDir "src/shared/java" }
    apiMod {
        java.setSrcDirs(['src/apiMod/java', 'src/shared/java'])
        resources.setSrcDirs(['src/apiMod/resources'])
        compileClasspath += configurations.compileClasspath + configurations.fabricLoaderRuntime + files(
                'libs/asplit-A.zip',
                'libs/asplit-B.zip'
        ) + fileTree(dir: 'libs', include: ['*.jar'], exclude: ['fabric-loader-*.jar'])
        runtimeClasspath += output + compileClasspath
    }
    regressionTest {
        compileClasspath += sourceSets.main.output + sourceSets.apiMod.output + sourceSets.apiMod.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('apiModJar', Jar) {
    archiveClassifier = 'api-mod'
    from sourceSets.apiMod.output
}

tasks.named('assemble') {
    dependsOn tasks.named('apiModJar')
}

// 回归夹具隔离在 build 下，不访问正常玩家的存档。
tasks.register('regressionTest', JavaExec) {
    group = 'verification'
    description = 'Runs headless framework regression tests with isolated user data.'
    dependsOn tasks.named('regressionTestClasses')
    dependsOn tasks.named('verifyTestInputs')
    classpath = sourceSets.regressionTest.runtimeClasspath
    mainClass = 'net.fabricacs.regression.FrameworkRegression'

    // 套件选择，两种等价写法（不传 = 全部套件，即 check 与 CI 一直以来的行为，永远不会漏跑）：
    //   -Pacbric.suites=event,rename   Gradle / IDE / CI 用
    //   ACBRIC_SUITES=event,rename     启动脚本 test.cmd / test.sh 用
    // 脚本走环境变量是因为 cmd.exe 会把参数里的 '=' 当分隔符拆开，
    // "-Pacbric.suites=event" 到不了 Gradle；环境变量没有这个问题，且两端脚本写法一致。
    // 套件名与覆盖范围见 BUILDING.zh-CN.md，或跑 regressionTest -Pacbric.suites=list。
    def suiteSelection = (findProperty('acbric.suites') ?: System.getenv('ACBRIC_SUITES') ?: '').toString().trim()
    if (!suiteSelection.isEmpty()) {
        setArgs(suiteSelection.split(',')*.trim().findAll { !it.isEmpty() })
    }

    def sandbox = layout.buildDirectory.dir('regression-sandbox')
    workingDir = sandbox
    systemProperty 'java.awt.headless', 'true'
    // 原版 JSON 的小数格式化依赖 sun.misc.FloatingDecimal2。普通 JDK 测试类加载器
    // 不搜索该模块包中的 classpath 类；仅测试进程补丁加载，游戏仍由 Knot 加载 FloatIO。
    jvmArgs '--patch-module', "jdk.unsupported=${file('libs/FloatIO.jar').absolutePath}"
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'stdout.encoding', 'UTF-8'
    systemProperty 'stderr.encoding', 'UTF-8'
    systemProperty 'user.home', sandbox.get().dir('home').asFile.absolutePath
    environment 'APPDATA', sandbox.get().dir('appdata').asFile.absolutePath
    doFirst {
        sandbox.get().asFile.mkdirs()
        sandbox.get().file('launch_settings.json').asFile.text = groovy.json.JsonOutput.toJson(
                [customDataDirectoryLocation: sandbox.get().dir('userdata').asFile.absolutePath])
    }
}

tasks.named('check') {
    dependsOn tasks.named('regressionTest')
}

// 只读取两份已导出的清单；非零退出码区分差异、无法验证及输入错误。
tasks.register('compareCodeManifests', JavaExec) {
    group = 'verification'
    description = 'Compares two local code manifests without starting the game.'
    dependsOn tasks.named('apiModClasses')
    classpath = sourceSets.apiMod.runtimeClasspath
    mainClass = 'net.fabricacs.api.impl.CodeManifestCompare'
    systemProperty 'file.encoding', 'UTF-8'
    doFirst {
        if (!project.hasProperty('manifestLeft') || !project.hasProperty('manifestRight')) {
            throw new GradleException('Supply -PmanifestLeft=<file> -PmanifestRight=<file>')
        }
        args = [project.file(project.property('manifestLeft')).absolutePath,
                project.file(project.property('manifestRight')).absolutePath]
    }
}

tasks.register('installApiMod', Copy) {
    dependsOn tasks.named('apiModJar')
    from tasks.named('apiModJar')
    into layout.projectDirectory.dir('game/mods')
    rename { 'acbric-api.jar' }
}

// ---- 独立 MOD 模板：同步编译依赖，不把依赖打入功能 MOD ----
def modTemplateDir = layout.projectDirectory.dir('acbric-mod-template')
def modTemplateLibsDir = modTemplateDir.dir('libs')

tasks.register('syncModTemplateLibs', Copy) {
    group = 'acbric'
    description = 'Copies the compile-time dependency bundle into acbric-mod-template/libs.'
    dependsOn tasks.named('apiModJar')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    into modTemplateLibsDir

    from(layout.projectDirectory.dir('libs')) {
        include '*.jar', '*.zip'
        exclude 'steamworks4j-1.3.0.jar'
    }

    from(tasks.named('apiModJar')) {
        rename { 'acbric-api.jar' }
    }
    from configurations.fabricLoaderRuntime
}

tasks.register('installAirshipsNativeLibraries', Copy) {
    from layout.projectDirectory.dir('libs/native')
    into layout.projectDirectory.dir('game/lib/native')
}

// 启动游戏需要完整的 game/ 目录；检查和编译一样要提前、要给人话。
def gameInputs = [
        ['game/Airships.json',      'GameProvider 靠它定位主类与内核 classPath'],
        ['game/data/checksum',      '游戏静态数据是否已拷入的标志文件'],
].collect { [it[0], layout.projectDirectory.file(it[0]).asFile, it[1]] }

tasks.register('verifyGameInputs') {
    group = 'acbric'
    description = 'Fails early with an actionable message when the game directory required to launch is missing.'
    doLast {
        def missing = gameInputs.findAll { !it[1].isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    'Missing game files required to launch Airships:\n' +
                    missing.collect { '  - ' + it[0] + '   (' + it[2] + ')' }.join('\n') +
                    '\n\nCopy your Airships game directory (Airships.json, data/, lib/native, ...) into this project\'s game/.' +
                    '\nRun without game files is still possible for library checks: gradlew assemble / gradlew regressionTest.' +
                    '\nSee BUILDING.md / BUILDING.zh-CN.md.')
        }
    }
}

tasks.register('runAirshipsFabric', JavaExec) {
    group = 'application'
    description = 'Builds, installs the Acbric API, and starts Airships with Fabric Loader.'
    dependsOn tasks.named('verifyGameInputs')
    dependsOn tasks.named('jar'), tasks.named('installApiMod'), tasks.named('installAirshipsNativeLibraries')

    workingDir = layout.projectDirectory.dir('game').asFile
    classpath = files(
            layout.buildDirectory.file("libs/${project.name}-${version}.jar")
    ) + configurations.fabricLoaderRuntime
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'

    jvmArgs '-Xmx4G',
            '--add-opens=java.base/java.util=ALL-UNNAMED',
            '-Ddev=true',
            "-Dsteam=${findProperty('airshipsSteam') ?: 'false'}"
    systemProperty 'org.lwjgl.librarypath', layout.projectDirectory.file('libs/native').asFile.absolutePath
    systemProperty 'net.java.games.input.librarypath', layout.projectDirectory.file('libs/native').asFile.absolutePath
    systemProperty 'java.library.path', layout.projectDirectory.file('libs/native').asFile.absolutePath
}

tasks.register('startAirships') {
    group = 'application'
    description = 'Starts Airships with Fabric Loader. Alias for runAirshipsFabric.'
    dependsOn tasks.named('runAirshipsFabric')
}

// 第一阶段仅生成检查工具，不复制游戏/API/实例内容，不启动游戏。
tasks.register('preflightTools', Sync) {
    group = 'acbric'
    description = 'Builds external-install preflight tools only; does not launch or package the game.'
    dependsOn tasks.named('jar')
    into layout.buildDirectory.dir('preflight')
    from('src/dist/check-install.ps1')
    from('LICENSE')
    from('EXTERNAL_INSTALL.md', 'EXTERNAL_INSTALL.zh-CN.md')
    into('loader-libs') {
        from tasks.named('jar')
        from configurations.fabricLoaderRuntime
    }
}

// ---- 通过 jlink 创建分发用 Java 21 运行时 ----
def bundledJreDir = layout.buildDirectory.dir('jre')

tasks.register('createBundledJre', Exec) {
    group = 'acbric'
    description = 'Creates a minimal JRE for distribution using jlink.'
    def jdkHome = System.getProperty('java.home')
    def osName = System.getProperty('os.name').toLowerCase()
    def jlinkExe = osName.contains('win') ? "${jdkHome}/bin/jlink.exe" : "${jdkHome}/bin/jlink"
    commandLine jlinkExe,
            '--compress', 'zip-6',
            '--no-header-files', '--no-man-pages', '--strip-debug',
            '--add-modules', 'java.base,java.compiler,java.desktop,java.logging,java.management,java.sql,jdk.unsupported,jdk.zipfs',
            '--output', bundledJreDir.get().asFile.absolutePath
    doFirst { delete bundledJreDir }
    inputs.property('modules', 'java.base,java.desktop,java.management,jdk.unsupported')
    outputs.dir bundledJreDir
}

// ---- 分发：启动依赖与游戏依赖分目录，避免重复类加载 ----
def distributionName = 'Acbric'
def distributionRoot = layout.buildDirectory.dir("dist/${distributionName}")

tasks.register('distDir', Sync) {
    dependsOn tasks.named('jar'), tasks.named('apiModJar'), tasks.named('syncModTemplateLibs'), tasks.named('createBundledJre')

    into distributionRoot
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(layout.projectDirectory.dir('src/dist')) {
        include 'run.bat'
    }
    from 'LICENSE'
    from 'README.md', 'README.zh-CN.md', 'BUNDLED_RESOURCES.md', 'EVENTS.md', 'CHANGELOG.md', 'CHANGELOG.zh-CN.md', 'API.md', 'API.zh-CN.md', 'DIAGNOSTICS.md', 'DIAGNOSTICS.zh-CN.md'
    from 'EVENT_SCOPES.md', 'EVENT_SCOPES.zh-CN.md'
    from 'CODE_MANIFEST.md', 'CODE_MANIFEST.zh-CN.md'
    from 'CODE_HANDSHAKE.md', 'CODE_HANDSHAKE.zh-CN.md'
    from 'LOBBY_HANDSHAKE.md', 'LOBBY_HANDSHAKE.zh-CN.md'
    from 'SHARED_RULES.md', 'SHARED_RULES.zh-CN.md'
    from 'RULE_SAVE_MIGRATION.md', 'RULE_SAVE_MIGRATION.zh-CN.md'
    from 'MOD_MANAGEMENT.md', 'MOD_MANAGEMENT.zh-CN.md'
    from 'UI.md', 'UI.zh-CN.md'
    from 'SETTINGS.md', 'SETTINGS.zh-CN.md'
    from 'DEVELOPMENT.md', 'DEVELOPMENT.zh-CN.md', 'COMMANDS.md', 'COMMANDS.zh-CN.md', 'DEVELOPER_TOOLS.md', 'DEVELOPER_TOOLS.zh-CN.md'
    from 'CONFIG.md', 'CONFIG.zh-CN.md'
    from 'CAMPAIGN_DATA.md', 'CAMPAIGN_DATA.zh-CN.md'
    from 'CAMPAIGN_LIFECYCLE.md', 'CAMPAIGN_LIFECYCLE.zh-CN.md'
    from 'BUILDING.md', 'BUILDING.zh-CN.md'
    doFirst {
        if (!file('src/dist/run.bat').isFile()) {
            throw new GradleException('Missing distribution launcher: src/dist/run.bat')
        }
    }

    into('acbric-mod-template') {
        from(modTemplateDir) {
            exclude '.gradle/**'
            exclude 'build/**'
        }
    }

    into('loader-libs') {
        from tasks.named('jar')
        from configurations.fabricLoaderRuntime
    }

    into('libs') {
        from(layout.projectDirectory.dir('libs')) {
            include '*.jar', '*.zip'
            exclude 'fabric-loader-*.jar'
            exclude 'sponge-mixin-*.jar', 'asm-*.jar'
            exclude 'steamworks4j-1.3.0.jar'
        }
    }

    into('jre') {
        from(bundledJreDir)
    }

    into('game') {
        from(layout.projectDirectory.dir('game')) {
            exclude '.fabric/**'
            exclude 'lib/**'
            exclude 'mods/acbric-api.jar'
            exclude 'config/acbric_mod_manager.json', 'config/acbric_mod_manager.json.lock'
        }
    }

    into('game/mods') {
        from(tasks.named('apiModJar')) {
            rename { 'acbric-api.jar' }
        }
    }

    into('game/lib/native') {
        from layout.projectDirectory.dir('libs/native')
    }
}

tasks.register('distZip', Zip) {
    dependsOn tasks.named('distDir')

    archiveFileName = "${distributionName}.zip"
    destinationDirectory = layout.buildDirectory.dir('dist')

    from(distributionRoot) {
        into distributionName
    }
}

// 外部发行使用允许清单，不复用旧 distDir 的游戏目录或模板 libs。
def externalRoot = layout.buildDirectory.dir('external-dist/Acbric')
tasks.register('externalDistDir', Sync) {
    group = 'acbric'
    description = 'Assembles a framework-only external distribution (bring Java 21 or bundle it explicitly).'
    dependsOn tasks.named('jar'), tasks.named('apiModJar')
    into externalRoot
    from('src/dist/start.ps1', 'src/dist/check-install.ps1', 'src/dist/setup.ps1', 'src/dist/Setup.cmd', 'src/dist/Start Acbric.cmd', 'src/dist/start-configured.ps1', 'LICENSE')
    from('src/dist/Update Acbric.cmd', 'src/dist/update.ps1', 'src/dist/maintenance.ps1', 'src/dist/QUICK_START.txt', 'src/dist/使用说明.txt')
    into('update-baselines') { from('src/dist/update-baselines') }
    from('EXTERNAL_INSTALL.md', 'EXTERNAL_INSTALL.zh-CN.md', 'EXTERNAL_START.md', 'EXTERNAL_START.zh-CN.md', 'INSTALLER.md', 'INSTALLER.zh-CN.md')
    into('docs') { from fileTree(projectDir) { include '*.md'; exclude 'AGENTS.md' } }
    into('mods') { from('src/dist/mods/README.md') }
    into('core') { from(tasks.named('apiModJar')) { rename { 'acbric-api.jar' } } }
    into('loader-libs') { from tasks.named('jar'); from configurations.fabricLoaderRuntime }
    into('acbric-mod-template') {
        from(modTemplateDir) {
            include 'src/**', 'gradle/wrapper/**', 'gradlew', 'gradlew.bat', 'build.gradle', 'settings.gradle', 'gradle.properties'
            include 'README.md', 'README.zh-CN.md', '.gitignore', 'local.properties.example'
        }
    }
    // 默认不打包运行时；显式 -PbundleRuntime 时仅复制 jlink 输出，不复制游戏自带 Java。
    if (project.hasProperty('bundleRuntime')) {
        dependsOn tasks.named('createBundledJre')
        into('runtime') { from bundledJreDir }
    }
    doLast {
        def root = externalRoot.get().asFile
        def lines = ['schema=1', "api.version=${new groovy.json.JsonSlurper().parse(file('src/apiMod/resources/fabric.mod.json')).version}"]
        fileTree(root) { include 'loader-libs/*.jar', 'core/acbric-api.jar' }.files.sort().each { input ->
            def hash = java.security.MessageDigest.getInstance('SHA-256').digest(input.bytes).encodeHex().toString()
            def relative = root.toPath().relativize(input.toPath()).toString().replace('\\', '/')
            lines.add("sha256.${relative}=${hash}")
        }
        new File(root, 'bundle.properties').setText(lines.join('\n') + '\n', 'UTF-8')
        def release = lines.take(2)
        fileTree(root) { exclude 'release-files.properties' }.files.sort().each { input ->
            def hash = java.security.MessageDigest.getInstance('SHA-256').digest(input.bytes).encodeHex().toString()
            def relative = root.toPath().relativize(input.toPath()).toString().replace('\\', '/')
            release.add("sha256.${relative}=${hash}")
        }
        new File(root, 'release-files.properties').setText(release.join('\n') + '\n', 'UTF-8')
    }
}

tasks.register('externalDistZip', Zip) {
    dependsOn tasks.named('externalDistDir')
    archiveFileName = 'Acbric-external.zip'
    destinationDirectory = layout.buildDirectory.dir('external-dist')
    from(externalRoot) { into 'Acbric' }
    // 包扫描失败则构建失败；输入安装仅用于本地内容指纹，路径不会写入 ZIP。
    doLast {
        exec {
            commandLine 'python', 'tools/verify_external_distribution.py', archiveFile.get().asFile.absolutePath,
                    '--game-dir', file(findProperty('externalGameDir') ?: 'game').absolutePath,
                    '--game-libs', file('libs').absolutePath,
                    '--report', layout.buildDirectory.file('external-dist/verification.json').get().asFile.absolutePath
            environment 'PYTHONUTF8', '1'
        }
    }
}
