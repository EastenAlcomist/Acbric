// Acbric — Fabric-style mod loading framework for Airships: Conquer the Skies.
//
// This repository ships the framework only:
//   src/main   — the Fabric launch shim (AirshipsGameProvider + GameProvider service entry)
//   src/apiMod — the runtime API (acbric_api: events, entrypoint bridge, native-mod UI
//                integration, hook mixins)
//
// It does NOT ship any game content. Before building you must copy, from your own
// Airships installation:
//   libs/  — asplit-A.zip / asplit-B.zip (game classes), fabric-loader-0.19.3.jar,
//            the game's library jars and libs/native/
//   game/  — Airships.json, launch_settings.json, data/, lib/, ...
// See README.md for the exact list.

plugins {
    id 'java'
}

group = 'net.fabricacs'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.fabricmc.net/'
    }
}

configurations {
    fabricLoaderRuntime
}

dependencies {
    compileOnly files('libs/fabric-loader-0.19.3.jar')
    fabricLoaderRuntime files('libs/fabric-loader-0.19.3.jar')
    fabricLoaderRuntime 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
    fabricLoaderRuntime 'org.ow2.asm:asm:9.8'
    fabricLoaderRuntime 'org.ow2.asm:asm-analysis:9.8'
    fabricLoaderRuntime 'org.ow2.asm:asm-commons:9.8'
    fabricLoaderRuntime 'org.ow2.asm:asm-tree:9.8'
    fabricLoaderRuntime 'org.ow2.asm:asm-util:9.8'
}

sourceSets {
    apiMod {
        java.setSrcDirs(['src/apiMod/java'])
        resources.setSrcDirs(['src/apiMod/resources'])
        compileClasspath += configurations.compileClasspath + configurations.fabricLoaderRuntime + files(
                'libs/asplit-A.zip',
                'libs/asplit-B.zip'
        ) + fileTree(dir: 'libs', include: ['*.jar'], exclude: ['fabric-loader-*.jar'])
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('apiModJar', Jar) {
    archiveClassifier = 'api-mod'
    from sourceSets.apiMod.output
}

tasks.register('installApiMod', Copy) {
    dependsOn tasks.named('apiModJar')
    from tasks.named('apiModJar')
    into layout.projectDirectory.dir('game/mods')
    rename { 'acbric-api.jar' }
}

// ---- mod development template ---------------------------------------------
def modTemplateDir = layout.projectDirectory.dir('acbric-mod-template')
def modTemplateLibsDir = modTemplateDir.dir('libs')

tasks.register('syncModTemplateLibs', Copy) {
    group = 'acbric'
    description = 'Copies the compile-time dependency bundle into acbric-mod-template/libs.'
    dependsOn tasks.named('apiModJar')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    into modTemplateLibsDir

    from(layout.projectDirectory.dir('libs')) {
        include '*.jar', '*.zip'
        exclude 'steamworks4j-1.3.0.jar'
    }

    from(tasks.named('apiModJar')) {
        rename { 'acbric-api.jar' }
    }
}

tasks.register('installAirshipsNativeLibraries', Copy) {
    from layout.projectDirectory.dir('libs/native')
    into layout.projectDirectory.dir('game/lib/native')
}

tasks.register('runAirshipsFabric', JavaExec) {
    group = 'application'
    description = 'Builds, installs the Acbric API, and starts Airships with Fabric Loader.'
    dependsOn tasks.named('jar'), tasks.named('installApiMod'), tasks.named('installAirshipsNativeLibraries')

    workingDir = layout.projectDirectory.dir('game').asFile
    classpath = files(
            layout.buildDirectory.file("libs/${project.name}-${version}.jar")
    ) + configurations.fabricLoaderRuntime
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'

    jvmArgs '-Xmx4G',
            '--add-opens=java.base/java.util=ALL-UNNAMED',
            '-Ddev=true',
            "-Dsteam=${findProperty('airshipsSteam') ?: 'false'}"
    systemProperty 'org.lwjgl.librarypath', layout.projectDirectory.file('libs/native').asFile.absolutePath
    systemProperty 'net.java.games.input.librarypath', layout.projectDirectory.file('libs/native').asFile.absolutePath
    systemProperty 'java.library.path', layout.projectDirectory.file('libs/native').asFile.absolutePath
}

tasks.register('startAirships') {
    group = 'application'
    description = 'Starts Airships with Fabric Loader. Alias for runAirshipsFabric.'
    dependsOn tasks.named('runAirshipsFabric')
}

// ---- bundled JRE via jlink ------------------------------------------------
def bundledJreDir = layout.buildDirectory.dir('jre')

tasks.register('createBundledJre', Exec) {
    group = 'acbric'
    description = 'Creates a minimal JRE for distribution using jlink.'
    def jdkHome = System.getProperty('java.home')
    def osName = System.getProperty('os.name').toLowerCase()
    def jlinkExe = osName.contains('win') ? "${jdkHome}/bin/jlink.exe" : "${jdkHome}/bin/jlink"
    commandLine jlinkExe,
            '--compress', 'zip-6',
            '--no-header-files', '--no-man-pages', '--strip-debug',
            '--add-modules', 'java.base,java.compiler,java.desktop,java.logging,java.management,java.sql,jdk.unsupported,jdk.zipfs',
            '--output', bundledJreDir.get().asFile.absolutePath
    doFirst { delete bundledJreDir }
    inputs.property('modules', 'java.base,java.desktop,java.management,jdk.unsupported')
    outputs.dir bundledJreDir
}

// ---- distribution ----------------------------------------------------------
def distributionName = 'Acbric'
def distributionRoot = layout.buildDirectory.dir("dist/${distributionName}")

tasks.register('distDir', Sync) {
    dependsOn tasks.named('jar'), tasks.named('apiModJar'), tasks.named('syncModTemplateLibs'), tasks.named('createBundledJre')

    into distributionRoot
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(layout.projectDirectory.dir('src/dist')) {
        include 'run.bat'
    }

    into('acbric-mod-template') {
        from(modTemplateDir) {
            exclude '.gradle/**'
            exclude 'build/**'
        }
    }

    into('libs') {
        from tasks.named('jar')
        from configurations.fabricLoaderRuntime
        from(layout.projectDirectory.dir('libs')) {
            include '*.jar', '*.zip'
            exclude 'fabric-loader-*.jar'
            exclude 'steamworks4j-1.3.0.jar'
        }
    }

    into('jre') {
        from(bundledJreDir)
    }

    into('game') {
        from(layout.projectDirectory.dir('game')) {
            exclude '.fabric/**'
            exclude 'lib/**'
            exclude 'mods/acbric-api.jar'
        }
    }

    into('game/mods') {
        from(tasks.named('apiModJar')) {
            rename { 'acbric-api.jar' }
        }
    }

    into('game/lib/native') {
        from layout.projectDirectory.dir('libs/native')
    }
}

tasks.register('distZip', Zip) {
    dependsOn tasks.named('distDir')

    archiveFileName = "${distributionName}.zip"
    destinationDirectory = layout.buildDirectory.dir('dist')

    from(distributionRoot) {
        into distributionName
    }
}
