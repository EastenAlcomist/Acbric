// 独立 MOD 模板构建：显式引用本机游戏和框架依赖；依赖从不进入模板或 MOD 产物。
// Java 17 是模板源代码/输出级别；所依赖的 Acbric API 编译与运行仍需要 JDK 21。
plugins {
    id 'java'
}

group = findProperty('mavenGroup') ?: 'net.fabricacs.template'
version = findProperty('modVersion') ?: '0.1.0'

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.fabricmc.net/'
    }
}

// 个人绝对路径仅放在被 Git 排除的 local.properties，命令行 -P 可覆盖。
def localPaths = new Properties()
if (file('local.properties').isFile()) file('local.properties').withReader('UTF-8') { localPaths.load(it) }
def pathOption = { name -> findProperty(name) ?: localPaths.getProperty(name) }
def templateLibsDir = file('libs') // 仅兼容开发者自备的旧依赖目录，不随发行打包。
def externalMode = pathOption('gameInstallDir') || pathOption('frameworkDir')
def installDir = file(pathOption('gameInstallDir') ?: 'missing-game-install')
def frameworkDir = file(pathOption('frameworkDir') ?: 'missing-framework')
def fabricLoaderJar = externalMode ? new File(frameworkDir, 'loader-libs/fabric-loader-0.19.3.jar') : new File(templateLibsDir, 'fabric-loader-0.19.3.jar')
def acbricApiJar = externalMode ? new File(frameworkDir, 'core/acbric-api.jar') : new File(templateLibsDir, 'acbric-api.jar')
def airshipsJarA = new File(externalMode ? installDir : templateLibsDir, 'asplit-A.zip')
def airshipsJarB = new File(externalMode ? installDir : templateLibsDir, 'asplit-B.zip')
def installTarget = pathOption('instanceDir') ?: pathOption('gameDir')
def gameDir = file(installTarget ?: 'missing-instance')

// 编译前明确列出缺失依赖，便于复制模板后定位配置错误。
tasks.register('verifyAcbricTemplateInputs') {
    doLast {
        def missing = [fabricLoaderJar, acbricApiJar, airshipsJarA, airshipsJarB].findAll { !it.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                            'Missing Acbric template dependencies:\n' +
                            missing.collect { ' - ' + it.absolutePath }.join('\n') +
                            '\n\nSet gameInstallDir and frameworkDir in local.properties / 请在 local.properties 指定游戏安装和框架发行目录。'
            )
        }
    }
}

// 依赖仅供编译，最终 MOD JAR 不包含游戏或框架类。
dependencies {
    compileOnly files(fabricLoaderJar)
    compileOnly files(acbricApiJar)
    compileOnly files(airshipsJarA, airshipsJarB)
    compileOnly fileTree(dir: externalMode ? new File(installDir, 'lib') : templateLibsDir, include: ['*.jar'], exclude: ['fabric-loader-*.jar', 'acbric-api.jar', 'steamworks4j-1.3.0.jar'])
    if (externalMode) compileOnly fileTree(dir: new File(frameworkDir, 'loader-libs'), include: ['sponge-mixin-*.jar', 'asm-*.jar'])
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('verifyAcbricTemplateInputs')
    options.encoding = 'UTF-8'
}

// 从 gradle.properties 展开 MOD 标识、名称与版本，保持入口资源可独立复制。
processResources {
    inputs.property 'modId', findProperty('modId')
    inputs.property 'modName', findProperty('modName')
    inputs.property 'modDescription', findProperty('modDescription')
    inputs.property 'modVersion', findProperty('modVersion')
    filesMatching('fabric.mod.json') {
        expand(
                modId: findProperty('modId'),
                modName: findProperty('modName'),
                modDescription: findProperty('modDescription'),
                modVersion: findProperty('modVersion')
        )
    }
}

jar {
    archiveBaseName = findProperty('modArchiveName') ?: project.name
}

tasks.register('installMod', Copy) {
    group = 'acbric'
    description = 'Builds this template mod and copies it into gameDir/mods.'
    dependsOn tasks.named('jar'), tasks.named('verifyInstallTarget')
    from tasks.named('jar')
    into new File(gameDir, 'mods')
    rename { "${findProperty('modArchiveName') ?: project.name}.jar" }
}

tasks.register('verifyInstallTarget') {
    doLast {
        if (!installTarget || !gameDir.isDirectory()) {
            throw new GradleException("gameDir does not exist: ${gameDir.absolutePath}\nSet instanceDir in local.properties or pass -PinstanceDir=...")
        }
    }
}

tasks.register('printTemplateInfo') {
    group = 'acbric'
    description = 'Prints the resolved Acbric paths used by this template project.'
    doLast {
        println "modId=${findProperty('modId')}"
        println "modName=${findProperty('modName')}"
        println "modVersion=${findProperty('modVersion')}"
        println "externalMode=${externalMode as boolean}"
        println "gameInstallDir=${installDir.absolutePath}"
        println "frameworkDir=${frameworkDir.absolutePath}"
        println "gameDir=${gameDir.absolutePath}"
        println "installTarget=${new File(gameDir, 'mods').absolutePath}"
    }
}
